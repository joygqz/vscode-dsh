name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write

    env:
      # The secrets context cannot be used in step-level if conditions, so booleanize it in job-level env first.
      HAS_VSCE_PAT: ${{ secrets.VSCE_PAT != '' }}
      HAS_OVSX_PAT: ${{ secrets.OVSX_PAT != '' }}

    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm compile

      - name: Run unit tests
        run: pnpm test

      - name: Build and package .vsix
        run: pnpm package

      - name: Create GitHub release (changelogithub)
        run: npx changelogithub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload .vsix to the release
        run: gh release upload "${{ github.ref_name }}" *.vsix --clobber
        env:
          GH_TOKEN: ${{ github.token }}

      # Optional: when both VSCE_PAT and OVSX_PAT are configured, publish to both marketplaces automatically.
      # Publishing also requires your own publisher and repository in package.json.
      - name: Publish to VS Code Marketplace & Open VSX
        if: env.HAS_VSCE_PAT == 'true' && env.HAS_OVSX_PAT == 'true'
        run: npx vsxpub --no-dependencies
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
