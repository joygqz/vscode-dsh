name: Publish Extension

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish or retry
        required: true
        type: string

concurrency:
  group: publish-extension
  cancel-in-progress: false

jobs:
  publish-extension:
    permissions:
      contents: write

    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Checkout release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          path: release-source
          fetch-depth: 0

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          runtime: node@24
          cache: true
          install: false

      - name: Validate publishing credentials
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ] || [ -z "$OVSX_PAT" ]; then
            echo "::error::VSCE_PAT and OVSX_PAT repository secrets are required"
            exit 1
          fi

      - name: Install release tooling
        run: pnpm install --frozen-lockfile

      - name: Install tagged source dependencies
        run: pnpm --dir release-source install --frozen-lockfile

      - name: Validate release tag
        working-directory: release-source
        run: node ../scripts/verify-release.mjs "$RELEASE_TAG"

      - name: Test tagged source
        working-directory: release-source
        run: pnpm verify

      - name: Package tagged source
        working-directory: release-source
        run: ../node_modules/.bin/vsce package --no-dependencies --out vscode-dsh.vsix

      - name: Publish to Visual Studio Marketplace
        working-directory: release-source
        run: ../node_modules/.bin/vsce publish --packagePath vscode-dsh.vsix --no-dependencies --skip-duplicate
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Publish to Open VSX Registry
        working-directory: release-source
        run: ../node_modules/.bin/ovsx publish vscode-dsh.vsix --no-dependencies --skip-duplicate
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

      - name: Create or update GitHub release
        working-directory: release-source
        run: ../node_modules/.bin/changelogithub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload .vsix to GitHub release
        working-directory: release-source
        run: gh release upload "$RELEASE_TAG" vscode-dsh.vsix --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
